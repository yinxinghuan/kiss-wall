<!doctype html><html><head><meta charset=utf-8>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Montserrat:wght@600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07070a; font-family: 'Inter', sans-serif; }
  .poster {
    width: 1024px; height: 1024px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #14141a 0%, #07070a 78%);
  }
  /* faint bust ghost behind */
  .ghost {
    position: absolute;
    left: 50%; top: 56%;
    transform: translate(-50%, -50%);
    width: 480px; height: 720px;
    opacity: 0.22;
    filter: blur(2px) saturate(0.4) sepia(0.3) hue-rotate(-15deg) brightness(0.7);
    background:
      url('silh-bust.png') center / contain no-repeat;
  }
  /* hero lip — fills the central area */
  .hero {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    width: 760px;
    height: auto;
    filter:
      drop-shadow(0 24px 60px rgba(180, 30, 70, 0.5))
      drop-shadow(0 0 80px rgba(245, 177, 199, 0.18));
  }
  .top { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 3; }
  .brand-tag {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.46em;
    color: rgba(245, 177, 199, 0.7);
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 108px;
    line-height: 0.92;
    color: #f5b1c7;
    letter-spacing: 0.005em;
    text-shadow: 0 0 30px rgba(245,177,199,0.22);
  }
  .epitaph {
    position: absolute;
    left: 12%; right: 12%; bottom: 100px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.32;
    color: #f5b1c7;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    z-index: 5;
  }
  .pitch {
    position: absolute;
    left: 0; right: 0; bottom: 56px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(240,238,219,0.55);
    text-align: center;
    z-index: 5;
  }
  .emblem {
    position: absolute;
    right: 36px; bottom: 28px;
    width: 50px; height: auto;
    opacity: 0.5;
    z-index: 6;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="ghost"></div>
    <img class="hero" src="poster-lip-2.png" />

    <div class="top">
      <div class="brand-tag">AlterU · After Dark</div>
      <div class="title">Kiss<br/>Wall.</div>
    </div>

    <div class="epitaph">leave a kiss in the dark.</div>
    <div class="pitch">she came back forty-seven times</div>

  </div>
</body>
</html>
